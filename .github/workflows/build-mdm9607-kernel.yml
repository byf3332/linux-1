name: build-mdm9607-kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y git build-essential bc bison flex libssl-dev libncurses5-dev device-tree-compiler python3 ca-certificates u-boot-tools xz-utils wget

      - name: Clone source
        run: |
          git clone https://github.com/byf3332/linux-1.git src

      - name: Inspect SDK crosstool
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          find src/ql-ol-sdk/ql-ol-crosstool/sysroots/x86_64-oesdk-linux -type f -name '*gcc' | sort | tee "$GITHUB_WORKSPACE/out/sdk_gcc_list.txt"
          find src/ql-ol-sdk/ql-ol-crosstool/sysroots/x86_64-oesdk-linux -type f -name '*gcc' -exec file {} \; | tee "$GITHUB_WORKSPACE/out/sdk_gcc_file.txt"

      - name: Prepare SDK toolchain
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          SDKROOT="$PWD/src/ql-ol-sdk/ql-ol-crosstool/sysroots/x86_64-oesdk-linux"
          SDK_EXPECTED="/home/ol/Beta_R02_linux/MDM9x07/OpenLinux/MCU_R06_update01/apps_proc/oe-core/build/tmp-glibc/deploy/sdk"

          sudo mkdir -p "$SDK_EXPECTED"
          sudo rm -f "$SDK_EXPECTED/ql-ol-sdk"
          sudo ln -s "$PWD/src/ql-ol-sdk" "$SDK_EXPECTED/ql-ol-sdk"

          TC_GCC="$(find "$SDKROOT" -type f -path '*/usr/bin/*/*gcc' | grep -E 'arm.*gcc$|gnueabi.*gcc$' | head -1)"
          echo "SDKROOT=$SDKROOT"
          echo "TC_GCC=$TC_GCC"
          file "$TC_GCC" || true

          echo "$(dirname "$TC_GCC")" >> "$GITHUB_PATH"
          PREFIX="$(basename "$TC_GCC" | sed 's/gcc$//')"
          echo "CROSS_PREFIX=$PREFIX" >> "$GITHUB_ENV"

          "$TC_GCC" --version | head -5 | tee "$GITHUB_WORKSPACE/out/sdk_gcc_version.txt"

      - name: Inspect source logic
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd src/ql-ol-sdk/ql-ol-kernel

          echo "===== qdsp6v2 header =====" | tee "$GITHUB_WORKSPACE/out/source_logic_check.txt"
          find . -name 'msm-pcm-routing-v2.h' -print | tee "$GITHUB_WORKSPACE/out/header_find.txt" | tee -a "$GITHUB_WORKSPACE/out/source_logic_check.txt"

          echo "===== APR Makefile/Kconfig references =====" | tee -a "$GITHUB_WORKSPACE/out/source_logic_check.txt"
          grep -n "MSM_QDSP6_APRV" drivers/soc/qcom/qdsp6v2/Makefile drivers/soc/qcom/Kconfig sound/soc/msm/Kconfig | tee "$GITHUB_WORKSPACE/out/apr_logic_check.txt" | tee -a "$GITHUB_WORKSPACE/out/source_logic_check.txt" || true

          echo "===== IPA config references =====" | tee -a "$GITHUB_WORKSPACE/out/source_logic_check.txt"
          grep -R -n "config IPA\|config IPA3\|RNDIS_IPA\|RMNET_IPA" drivers/platform/msm drivers/net/ethernet/msm 2>/dev/null | head -200 | tee "$GITHUB_WORKSPACE/out/ipa_logic_check.txt" | tee -a "$GITHUB_WORKSPACE/out/source_logic_check.txt" || true

          echo "===== trace header paths =====" | tee -a "$GITHUB_WORKSPACE/out/source_logic_check.txt"
          grep -R "TRACE_INCLUDE_PATH" drivers/net/ethernet/msm/rndis_ipa_trace.h drivers/platform/msm/ipa/ipa_v2/ipa_trace.h drivers/platform/msm/ipa/ipa_v3/ipa_trace.h 2>/dev/null | tee "$GITHUB_WORKSPACE/out/trace_path_check.txt" | tee -a "$GITHUB_WORKSPACE/out/source_logic_check.txt" || true

      - name: Prepare kernel config
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd src/ql-ol-sdk/ql-ol-kernel

          echo "Using CROSS_COMPILE=${CROSS_PREFIX}"
          ${CROSS_PREFIX}gcc --version | head -5

          make ARCH=arm CROSS_COMPILE=${CROSS_PREFIX} mdm9607-perf_defconfig

          scripts/config --enable SND
          scripts/config --enable SND_PCM
          scripts/config --enable SND_SOC
          scripts/config --enable SND_DYNAMIC_MINORS
          scripts/config --set-val SND_MAX_CARDS 32

          scripts/config --enable SND_SOC_MDM9607 || true
          scripts/config --enable SND_SOC_QDSP6V2 || true
          scripts/config --enable SND_SOC_MSM_STUB || true
          scripts/config --enable SND_SOC_MSM_HOSTLESS_PCM || true
          scripts/config --enable MSM_QDSP6V2_CODECS || true

          scripts/config --disable MSM_QDSP6_APRV2 || true
          scripts/config --enable MSM_QDSP6_APRV3 || true

          scripts/config --enable IPA || true
          scripts/config --disable IPA3 || true
          scripts/config --disable RMNET_IPA3 || true

          scripts/config --disable DEBUG_INFO || true
          scripts/config --disable KALLSYMS_ALL || true

          make ARCH=arm CROSS_COMPILE=${CROSS_PREFIX} olddefconfig

          grep -E 'CONFIG_LOCALVERSION|CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_MSM_QDSP6V2_CODECS|CONFIG_SND_SOC_MSM_HOSTLESS_PCM|CONFIG_SND_SOC_MSM_QDSP6V2_INTF|CONFIG_SND_SOC_QDSP6V2|CONFIG_SND_SOC_MDM9607|CONFIG_SND_SOC_MSM_STUB|CONFIG_MSM_QDSP6_APRV3|CONFIG_MSM_QDSP6_APRV2|CONFIG_IPA=|CONFIG_IPA3|CONFIG_RMNET_IPA|CONFIG_RMNET_IPA3|CONFIG_ECM_IPA|CONFIG_RNDIS_IPA|CONFIG_SND_DYNAMIC_MINORS|CONFIG_SND_MAX_CARDS|CONFIG_DEBUG_INFO|CONFIG_DEBUG_KERNEL|CONFIG_KALLSYMS_ALL' .config | tee "$GITHUB_WORKSPACE/out/kernel_config_check.txt"

      - name: Build zImage and dtbs
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd src/ql-ol-sdk/ql-ol-kernel

          make ARCH=arm \
            CROSS_COMPILE=${CROSS_PREFIX} \
            CC=${CROSS_PREFIX}gcc \
            HOSTCFLAGS="-fcommon" \
            KCFLAGS="-I$PWD/sound/soc/msm -I$PWD/drivers/net/ethernet/msm -I$PWD/drivers/platform/msm/ipa/ipa_v2" \
            -j$(nproc) zImage dtbs 2>&1 | tee "$GITHUB_WORKSPACE/out/kernel_build.log"

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out/dtb

          cp src/ql-ol-sdk/ql-ol-kernel/.config out/config_mdm9607_kernel || true
          cp src/ql-ol-sdk/ql-ol-kernel/arch/arm/boot/zImage out/zImage_mdm9607_audio || true

          find src/ql-ol-sdk/ql-ol-kernel/arch/arm/boot/dts/qcom -name 'mdm9607*.dtb' -exec cp {} out/dtb/ \; || true

          find out -type f | sort > out/filelist.txt
          ls -lh out > out/output_sizes.txt || true
          ls -lh out/dtb >> out/output_sizes.txt || true
          if [ -f out/zImage_mdm9607_audio ]; then
            du -h out/zImage_mdm9607_audio >> out/output_sizes.txt
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdm9607-kernel-build
          path: out/
