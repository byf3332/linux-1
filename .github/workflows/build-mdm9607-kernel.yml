name: build-mdm9607-kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y git build-essential bc bison flex libssl-dev libncurses5-dev device-tree-compiler python3 ca-certificates u-boot-tools xz-utils wget

      - name: Clone source
        run: |
          git clone https://github.com/byf3332/linux-1.git src

      - name: Inspect SDK crosstool
        run: |
          find src/ql-ol-sdk/ql-ol-crosstool/sysroots/x86_64-oesdk-linux -type f -name '*gcc' | sort | tee sdk_gcc_list.txt
          find src/ql-ol-sdk/ql-ol-crosstool/sysroots/x86_64-oesdk-linux -type f -name '*gcc' -exec file {} \; | tee sdk_gcc_file.txt
          find src/ql-ol-sdk/ql-ol-crosstool/sysroots/x86_64-oesdk-linux -type f -name '*gcc' -exec {} --version \; 2>&1 | tee sdk_gcc_version.txt

      - name: Prepare toolchain
        run: |
          SDKROOT="$PWD/src/ql-ol-sdk/ql-ol-crosstool/sysroots/x86_64-oesdk-linux"
          TC_GCC="$(find "$SDKROOT" -type f -path '*/usr/bin/*/*gcc' | grep -E 'arm.*gcc$|gnueabi.*gcc$' | head -1)"
          echo "TC_GCC=$TC_GCC"
          file "$TC_GCC" || true
          "$TC_GCC" --version | head -5 || true
          echo "$(dirname "$TC_GCC")" >> $GITHUB_PATH
          PREFIX="$(basename "$TC_GCC" | sed 's/gcc$//')"
          echo "CROSS_PREFIX=$PREFIX" >> $GITHUB_ENV
          echo "Using CROSS_PREFIX=$PREFIX"

      - name: Patch old kernel build issues
        run: |
          cd src/ql-ol-sdk/ql-ol-kernel
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l || true
          cat > scripts/gcc-wrapper.py <<'PY'
          #!/usr/bin/env python3
          import subprocess
          import sys
          def main():
              p = subprocess.Popen(sys.argv[1:])
              return p.wait()
          if __name__ == "__main__":
              sys.exit(main())
          PY
          chmod +x scripts/gcc-wrapper.py
          find . -name 'msm-pcm-routing-v2.h' -print | tee ../../header_find.txt

      - name: Prepare kernel config
        run: |
          cd src/ql-ol-sdk/ql-ol-kernel
          echo "Using CROSS_COMPILE=${CROSS_PREFIX}"
          ${CROSS_PREFIX}gcc --version | head -5
          make ARCH=arm CROSS_COMPILE=${CROSS_PREFIX} mdm9607-perf_defconfig
          scripts/config --enable SND
          scripts/config --enable SND_PCM
          scripts/config --enable SND_SOC
          scripts/config --enable MSM_QDSP6V2_CODECS || true
          scripts/config --enable MSM_QDSP6_APRV2 || true
          scripts/config --disable MSM_QDSP6_APRV3 || true
          scripts/config --enable SND_SOC_MSM_HOSTLESS_PCM || true
          scripts/config --enable SND_SOC_MSM_QDSP6V2_INTF || true
          scripts/config --enable SND_SOC_QDSP6V2 || true
          scripts/config --enable SND_SOC_MDM9607 || true
          scripts/config --enable SND_SOC_MSM_STUB || true
          scripts/config --enable SND_DYNAMIC_MINORS
          scripts/config --set-val SND_MAX_CARDS 32
          scripts/config --disable DEBUG_INFO || true
          scripts/config --disable DEBUG_KERNEL || true
          scripts/config --disable KALLSYMS_ALL || true
          make ARCH=arm CROSS_COMPILE=${CROSS_PREFIX} olddefconfig
          grep -E 'CONFIG_LOCALVERSION|CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_MSM_QDSP6V2_CODECS|CONFIG_SND_SOC_MSM_HOSTLESS_PCM|CONFIG_SND_SOC_MSM_QDSP6V2_INTF|CONFIG_SND_SOC_QDSP6V2|CONFIG_SND_SOC_MDM9607|CONFIG_SND_SOC_MSM_STUB|CONFIG_MSM_QDSP6_APRV3|CONFIG_MSM_QDSP6_APRV2|CONFIG_SND_DYNAMIC_MINORS|CONFIG_SND_MAX_CARDS|CONFIG_DEBUG_INFO|CONFIG_DEBUG_KERNEL|CONFIG_KALLSYMS_ALL' .config | tee ../../kernel_config_check.txt

      - name: Build zImage and dtbs
        run: |
          cd src/ql-ol-sdk/ql-ol-kernel
          make ARCH=arm CROSS_COMPILE=${CROSS_PREFIX} -j$(nproc) zImage dtbs 2>&1 | tee ../../kernel_build.log

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out/dtb
          cp toolchain/found_gcc.txt out/found_gcc.txt || true
          cp src/ql-ol-sdk/ql-ol-kernel/.config out/config_mdm9607_kernel || true
          cp src/ql-ol-sdk/header_find.txt out/header_find.txt || true
          cp src/ql-ol-sdk/kernel_config_check.txt out/kernel_config_check.txt || true
          cp src/ql-ol-sdk/kernel_build.log out/kernel_build.log || true
          cp src/ql-ol-sdk/ql-ol-kernel/arch/arm/boot/zImage out/zImage_mdm9607_audio || true
          find src/ql-ol-sdk/ql-ol-kernel/arch/arm/boot/dts/qcom -name 'mdm9607*.dtb' -exec cp {} out/dtb/ \; || true
          find out -type f | sort > out/filelist.txt
          ls -lh out > out/output_sizes.txt || true
          ls -lh out/dtb >> out/output_sizes.txt || true
          du -h out/zImage_mdm9607_audio >> out/output_sizes.txt || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdm9607-kernel-build
          path: out/
