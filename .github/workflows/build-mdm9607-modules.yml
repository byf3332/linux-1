name: build-mdm9607-audio-modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ubuntu:18.04

    steps:
      - name: Install build deps
        run: |
          apt update
          apt install -y git build-essential bc bison flex libssl-dev libncurses5-dev device-tree-compiler gcc-arm-linux-gnueabi python python-minimal ca-certificates

      - name: Clone source
        run: |
          git clone https://github.com/hewenhao2008/linux-1.git src

      - name: Patch old kernel build issues
        run: |
          cd src/ql-ol-sdk/ql-ol-kernel
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l || true
          sed -i 's/return 1/return 0/g' scripts/gcc-wrapper.py
          find . -name 'msm-pcm-routing-v2.h' -print | tee ../../header_find.txt

      - name: Prepare module config
        run: |
          cd src/ql-ol-sdk/ql-ol-kernel
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- mdm9607-perf_defconfig
          scripts/config --enable MODULES
          scripts/config --enable SND
          scripts/config --enable SND_PCM
          scripts/config --enable SND_SOC
          scripts/config --module SND_SOC_MDM9607 || true
          scripts/config --module SND_SOC_QDSP6V2 || true
          scripts/config --module SND_SOC_MSM_QDSP6V2_INTF || true
          scripts/config --module SND_SOC_MSM_HOSTLESS_PCM || true
          scripts/config --module SND_SOC_MSM_STUB || true
          scripts/config --enable MSM_QDSP6V2_CODECS || true
          scripts/config --enable MSM_QDSP6_APRV2 || true
          scripts/config --disable MSM_QDSP6_APRV3 || true
          scripts/config --enable SND_DYNAMIC_MINORS
          scripts/config --set-val SND_MAX_CARDS 32
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- olddefconfig
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- prepare modules_prepare
          grep -E 'CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_MSM_QDSP6V2_CODECS|CONFIG_SND_SOC_MSM_HOSTLESS_PCM|CONFIG_SND_SOC_MSM_QDSP6V2_INTF|CONFIG_SND_SOC_QDSP6V2|CONFIG_SND_SOC_MDM9607|CONFIG_SND_SOC_MSM_STUB|CONFIG_MSM_QDSP6_APRV3|CONFIG_MSM_QDSP6_APRV2|CONFIG_SND_DYNAMIC_MINORS|CONFIG_SND_MAX_CARDS' .config | tee ../../audio_module_config_check.txt

      - name: Build audio-related modules only
        run: |
          cd src/ql-ol-sdk/ql-ol-kernel
          export KCFLAGS="-I$PWD/sound/soc/msm -Wno-unused-const-variable -Wno-unused-variable -Wno-misleading-indentation -Wno-declaration-after-statement -Wno-duplicate-decl-specifier -Wno-incompatible-pointer-types -Wno-return-type"
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- -j$(nproc) drivers/soc/qcom/qdsp6v2/ 2>&1 | tee ../../modules_build.log
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- -j$(nproc) sound/soc/msm/ 2>&1 | tee -a ../../modules_build.log

      - name: Collect modules
        if: always()
        run: |
          mkdir -p out/ko
          cp src/ql-ol-sdk/ql-ol-kernel/.config out/config_mdm9607_modules || true
          cp src/ql-ol-sdk/audio_module_config_check.txt out/audio_module_config_check.txt || true
          cp src/ql-ol-sdk/header_find.txt out/header_find.txt || true
          cp src/ql-ol-sdk/modules_build.log out/modules_build.log || true
          cp src/ql-ol-sdk/ql-ol-kernel/Module.symvers out/Module.symvers || true
          cp src/ql-ol-sdk/ql-ol-kernel/modules.order out/modules.order || true
          find src/ql-ol-sdk/ql-ol-kernel -name '*.ko' -exec cp --parents {} out/ko/ \; || true
          find out -type f | sort > out/filelist.txt
          ls -lh out > out/output_sizes.txt || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdm9607-audio-modules
          path: out/
