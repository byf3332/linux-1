name: build-qdc507-baseline-kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y git build-essential bc bison flex libssl-dev libncurses5-dev device-tree-compiler python3 ca-certificates u-boot-tools xz-utils wget

      - name: Clone source
        run: |
          git clone https://github.com/byf3332/linux-1.git src

      - name: Copy original kernel config
        run: |
          mkdir -p out
          cp src/.github/kernel_configs/qdc507_orig_boot.config out/qdc507_orig_boot.config
          cp src/.github/kernel_configs/qdc507_orig_boot.config src/ql-ol-sdk/ql-ol-kernel/.config

      - name: Inspect SDK crosstool
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          find src/ql-ol-sdk/ql-ol-crosstool/sysroots/x86_64-oesdk-linux -type f -name '*gcc' | sort | tee "$GITHUB_WORKSPACE/out/sdk_gcc_list.txt"
          find src/ql-ol-sdk/ql-ol-crosstool/sysroots/x86_64-oesdk-linux -type f -name '*gcc' -exec file {} \; | tee "$GITHUB_WORKSPACE/out/sdk_gcc_file.txt"

      - name: Prepare SDK toolchain
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"

          SDKROOT="$PWD/src/ql-ol-sdk/ql-ol-crosstool/sysroots/x86_64-oesdk-linux"
          SDK_EXPECTED="/home/ol/Beta_R02_linux/MDM9x07/OpenLinux/MCU_R06_update01/apps_proc/oe-core/build/tmp-glibc/deploy/sdk"

          sudo mkdir -p "$SDK_EXPECTED"
          sudo rm -f "$SDK_EXPECTED/ql-ol-sdk"
          sudo ln -s "$PWD/src/ql-ol-sdk" "$SDK_EXPECTED/ql-ol-sdk"

          TC_GCC="$(find "$SDKROOT" -type f -path '*/usr/bin/*/*gcc' | grep -E 'arm.*gcc$|gnueabi.*gcc$' | head -1)"
          echo "SDKROOT=$SDKROOT"
          echo "TC_GCC=$TC_GCC"
          file "$TC_GCC" || true

          echo "$(dirname "$TC_GCC")" >> "$GITHUB_PATH"
          PREFIX="$(basename "$TC_GCC" | sed 's/gcc$//')"
          echo "CROSS_PREFIX=$PREFIX" >> "$GITHUB_ENV"

          "$TC_GCC" --version | head -5 | tee "$GITHUB_WORKSPACE/out/sdk_gcc_version.txt"

      - name: Prepare baseline config
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd src/ql-ol-sdk/ql-ol-kernel

          echo "Using CROSS_COMPILE=${CROSS_PREFIX}"
          ${CROSS_PREFIX}gcc --version | head -5

          cp "$GITHUB_WORKSPACE/src/.github/kernel_configs/qdc507_orig_boot.config" .config

          scripts/config --disable MTD_UBI_BLOCK || true

          make ARCH=arm \
            CROSS_COMPILE=${CROSS_PREFIX} \
            CC=${CROSS_PREFIX}gcc \
            HOSTCFLAGS="-fcommon" \
            olddefconfig 2>&1 | tee "$GITHUB_WORKSPACE/out/olddefconfig.log"

          cp .config "$GITHUB_WORKSPACE/out/config_qdc507_baseline_after_olddefconfig"

          echo "===== config diff against original =====" | tee "$GITHUB_WORKSPACE/out/config_diff.txt"
          diff -u "$GITHUB_WORKSPACE/src/.github/kernel_configs/qdc507_orig_boot.config" .config | tee -a "$GITHUB_WORKSPACE/out/config_diff.txt" || true

          grep -E 'CONFIG_LOCALVERSION|CONFIG_LOCALVERSION_AUTO|CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_ARCH_MDM9607|CONFIG_MSM_QDSP6V2_CODECS|CONFIG_SND_SOC_QDSP6V2|CONFIG_SND_SOC_MDM9607|CONFIG_MSM_QDSP6_APRV2|CONFIG_MSM_QDSP6_APRV3|CONFIG_IPA=|CONFIG_IPA3|CONFIG_DEBUG_INFO|CONFIG_DEBUG_GPIO' .config | tee "$GITHUB_WORKSPACE/out/baseline_config_check.txt" || true

      - name: Build baseline zImage and dtbs
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd src/ql-ol-sdk/ql-ol-kernel

          make ARCH=arm \
            CROSS_COMPILE=${CROSS_PREFIX} \
            CC=${CROSS_PREFIX}gcc \
            HOSTCFLAGS="-fcommon" \
            KCFLAGS="-I$PWD/sound/soc/msm -I$PWD/drivers/net/ethernet/msm -I$PWD/drivers/platform/msm/ipa/ipa_v2 -I$PWD/drivers/soc/qcom -I$PWD/drivers/usb/gadget" \
            -j$(nproc) zImage dtbs 2>&1 | tee "$GITHUB_WORKSPACE/out/kernel_build.log"

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out/dtb

          cp src/ql-ol-sdk/ql-ol-kernel/.config out/config_qdc507_baseline_final || true
          cp src/ql-ol-sdk/ql-ol-kernel/arch/arm/boot/zImage out/zImage_qdc507_baseline || true

          find src/ql-ol-sdk/ql-ol-kernel/arch/arm/boot/dts/qcom -name 'mdm9607*.dtb' -exec cp {} out/dtb/ \; || true

          find out -type f | sort > out/filelist.txt
          ls -lh out > out/output_sizes.txt || true
          ls -lh out/dtb >> out/output_sizes.txt || true
          if [ -f out/zImage_qdc507_baseline ]; then
            du -h out/zImage_qdc507_baseline >> out/output_sizes.txt
            sha256sum out/zImage_qdc507_baseline > out/zImage_qdc507_baseline.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qdc507-baseline-kernel
          path: out/
